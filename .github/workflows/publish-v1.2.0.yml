name: Publish PCSmartFileManager v1.2.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-v1-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify draft assets and publish
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = 392681567;
            const target = '7c11d5ce69b04e00ea6861f73cb383572d8165e8';
            const expected = new Map([
              ['PCSmartFileManager-1.2.0-win-x64-setup.exe', [51620369, 'sha256:d101f44c9c2acf15aced459d9353e7de2fde8305217d6e5c73b8fe1ad3b4e346']],
              ['PCSmartFileManager-1.2.0-win-x64-portable.zip', [71336519, 'sha256:378d51cd8cafa601573695eaad5de132347ee98fac0d0ebf69b97fb03ed7955c']],
              ['SHA256SUMS.txt', [221, 'sha256:cf59d3ed701be4cbedb82875a3911cc262ebf32a5165ddd4678c17253115f780']],
              ['HUONG-DAN-CAP-NHAT.txt', [4487, 'sha256:17238d363d0401b0bcd048d042ce980fc9822a18aab9e311df221cd6d3e78c3c']],
            ]);

            const { data: release } = await github.request('GET /repos/{owner}/{repo}/releases/{release_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            if (!release.draft) {
              if (release.tag_name === 'v1.2.0' && !release.prerelease) {
                core.info('v1.2.0 is already published; nothing to do.');
                return;
              }
              throw new Error('Release is already public in an unexpected state.');
            }

            if (release.target_commitish !== target) {
              throw new Error('Draft target commit changed.');
            }
            if (!release.body || release.body.length < 4000) {
              throw new Error('Release notes are missing or unexpectedly short.');
            }
            if (release.assets.length !== expected.size) {
              throw new Error('Unexpected draft asset count: ' + release.assets.length);
            }

            for (const asset of release.assets) {
              const spec = expected.get(asset.name);
              if (!spec) throw new Error('Unexpected asset: ' + asset.name);
              if (asset.size !== spec[0]) throw new Error('Size mismatch: ' + asset.name);
              if (String(asset.digest || '').toLowerCase() !== spec[1]) {
                throw new Error('Digest mismatch: ' + asset.name);
              }
            }
            for (const name of expected.keys()) {
              if (!release.assets.some(a => a.name === name)) throw new Error('Missing asset: ' + name);
            }

            const { data: published } = await github.request('PATCH /repos/{owner}/{repo}/releases/{release_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              tag_name: 'v1.2.0',
              target_commitish: target,
              name: 'PCSmartFileManager v1.2.0',
              draft: false,
              prerelease: false,
            });

            if (published.draft || published.prerelease || published.tag_name !== 'v1.2.0') {
              throw new Error('Publish state verification failed.');
            }
            core.info('Published: ' + published.html_url);
